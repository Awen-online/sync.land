openapi: 3.0.3
info:
  title: Sync.Land API
  description: |
    REST API for Sync.Land music licensing platform.

    ## Authentication

    ### API Key (Recommended for External Apps)
    Include your API key in the `X-API-Key` header:
    ```
    X-API-Key: fml_your_api_key_here
    ```

    ### WordPress Nonce (Internal)
    For same-origin requests, use the `_wpnonce` parameter or `X-WP-Nonce` header.

    ### Personal Access Token (Streamer API)
    The streaming surface under `/streamer/*` uses a per-user Personal Access
    Token, minted by the user at `/account/tokens/` and sent as a bearer token:
    ```
    Authorization: Bearer sk_syncland_...
    ```
    Tokens are stored as a SHA-256 digest; the plaintext is shown once at
    creation and cannot be recovered. Token management itself
    (`/streamer/tokens`) is same-origin and nonce-authenticated, so a token can
    never mint or revoke another token.

    ### JWT Authentication (Alternative)
    Install the **JWT Authentication for WP REST API** plugin for Bearer token auth:
    - Plugin: https://wordpress.org/plugins/jwt-authentication-for-wp-rest-api/

    ## Rate Limiting
    - Default: 100 requests per hour
    - Headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`

    ## Pods REST API (Alternative)
    WordPress Pods plugin provides a built-in REST API for standard CRUD:
    - **Songs**: `/wp-json/pods/v1/song/`
    - **Artists**: `/wp-json/pods/v1/artist/`
    - **Albums**: `/wp-json/pods/v1/album/`
    - **Licenses**: `/wp-json/pods/v1/license/`
    - **Playlists**: `/wp-json/pods/v1/playlist/`
  version: 1.2.0
  contact:
    name: Sync.Land
    url: https://sync.land

servers:
  - url: https://sync.land/wp-json/FML/v1
    description: Production
  - url: http://sync.local/wp-json/FML/v1
    description: Local Development

tags:
  - name: Songs
    description: Song search and management
  - name: Artists
    description: Artist information
  - name: Albums
    description: Album information
  - name: Licensing
    description: License generation and management
  - name: NFT
    description: NFT minting for licenses
  - name: Payments
    description: Stripe payment integration
  - name: Playlists
    description: User playlist management
  - name: System
    description: API status and management
  - name: Streamer
    description: Streaming clearance, playlists and usage reporting for external players
  - name: Verification
    description: Public, unauthenticated verification of an issued sync license

security:
  - ApiKeyAuth: []
  - WordPressNonce: []

paths:
  # ============================================================================
  # SONGS
  # ============================================================================
  /songs:
    get:
      tags:
        - Songs
      summary: Search songs
      description: Search for songs with various filters
      security:
        - {}  # Public endpoint
      parameters:
        - name: q
          in: query
          description: Search query for song title
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: mood
          in: query
          schema:
            type: string
        - name: bpm_min
          in: query
          schema:
            type: integer
        - name: bpm_max
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  songs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Song'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '429':
          $ref: '#/components/responses/RateLimited'

  /songs/{id}:
    get:
      tags:
        - Songs
      summary: Get song by ID
      security:
        - {}  # Public endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  song:
                    $ref: '#/components/schemas/Song'
        '404':
          $ref: '#/components/responses/NotFound'

  /songs/{id}/licenses:
    get:
      tags:
        - Songs
        - Licensing
      summary: Get licenses for a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  song_id:
                    type: integer
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/License'

  # ============================================================================
  # ARTISTS
  # ============================================================================
  /artists/{id}:
    get:
      tags:
        - Artists
      summary: Get artist by ID
      security:
        - {}  # Public endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  artist:
                    $ref: '#/components/schemas/Artist'
        '404':
          $ref: '#/components/responses/NotFound'

  /artists/{id}/songs:
    get:
      tags:
        - Artists
        - Songs
      summary: Get songs by artist
      security:
        - {}  # Public endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  artist:
                    $ref: '#/components/schemas/Artist'
                  songs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Song'

  # ============================================================================
  # ALBUMS
  # ============================================================================
  /albums/{id}:
    get:
      tags:
        - Albums
      summary: Get album by ID
      security:
        - {}  # Public endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  album:
                    $ref: '#/components/schemas/Album'
        '404':
          $ref: '#/components/responses/NotFound'

  /albums/{id}/songs:
    get:
      tags:
        - Albums
        - Songs
      summary: Get songs in album
      security:
        - {}  # Public endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  album:
                    $ref: '#/components/schemas/Album'
                  songs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Song'

  # ============================================================================
  # LICENSES
  # ============================================================================
  /licenses/{id}:
    get:
      tags:
        - Licensing
      summary: Get license by ID
      description: Requires authentication. Users can only view their own licenses.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  license:
                    $ref: '#/components/schemas/License'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /licenses/request:
    post:
      tags:
        - Licensing
      summary: Request a CC-BY license
      description: Create a new Creative Commons Attribution 4.0 license with optional NFT minting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - song_id
                - licensee_name
                - project_name
              properties:
                song_id:
                  type: integer
                licensee_name:
                  type: string
                project_name:
                  type: string
                mint_nft:
                  type: boolean
                  default: false
                wallet_address:
                  type: string
                  description: Required if mint_nft is true
      responses:
        '201':
          description: License created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  license_id:
                    type: integer
                  license_url:
                    type: string
                  message:
                    type: string
                  nft:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [pending, failed]
                      message:
                        type: string

  /licenses/my:
    get:
      tags:
        - Licensing
      summary: Get current user's licenses
      description: Requires WordPress session authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/License'

  /licenses/{id}/payment-status:
    get:
      tags:
        - Licensing
        - Payments
      summary: Get license payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  license_id:
                    type: integer
                  license_type:
                    type: string
                    enum: [cc_by, non_exclusive]
                  payment_status:
                    type: string
                    enum: [pending, completed, failed, not_applicable]
                  payment_amount:
                    type: integer
                  payment_currency:
                    type: string

  # ============================================================================
  # NFT
  # ============================================================================
  /licenses/{id}/mint-nft:
    post:
      tags:
        - NFT
        - Licensing
      summary: Mint license as NFT
      description: Mint a CC-BY license as an NFT on Cardano blockchain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallet_address
              properties:
                wallet_address:
                  type: string
                  description: Cardano wallet address (addr1... or addr_test1...)
      responses:
        '200':
          description: NFT minting initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  nft_status:
                    type: string
                  transaction_hash:
                    type: string

  /licenses/{id}/nft-status:
    get:
      tags:
        - NFT
        - Licensing
      summary: Get NFT status for license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  license_id:
                    type: integer
                  nft_status:
                    type: string
                    enum: [pending, minted, failed, none]
                  nft_asset_id:
                    type: string
                  nft_transaction_hash:
                    type: string
                  nft_minted_at:
                    type: string

  # ============================================================================
  # PAYMENTS (STRIPE)
  # ============================================================================
  /stripe/create-checkout:
    post:
      tags:
        - Payments
      summary: Create Stripe checkout session
      description: |
        Create a Stripe Checkout session for purchasing a non-exclusive sync license.
        Requires WordPress session authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - song_id
              properties:
                song_id:
                  type: integer
                licensee_name:
                  type: string
                project_name:
                  type: string
                usage_description:
                  type: string
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  checkout_url:
                    type: string
                    description: Redirect user to this URL
                  session_id:
                    type: string

  /stripe/webhook:
    post:
      tags:
        - Payments
      summary: Stripe webhook handler
      description: |
        Handles Stripe webhook events. Called by Stripe, not external applications.
        Requires valid Stripe signature.
      security: []
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean

  # ============================================================================
  # API KEYS (ADMIN)
  # ============================================================================
  /api-keys:
    get:
      tags:
        - System
      summary: List API keys
      description: Admin only
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_id:
                          type: string
                        app_name:
                          type: string
                        created_at:
                          type: string
                        last_used:
                          type: string
                        request_count:
                          type: integer
    post:
      tags:
        - System
      summary: Create API key
      description: Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_name
              properties:
                app_name:
                  type: string
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  key_id:
                    type: string
                  api_key:
                    type: string
                    description: Store securely - shown only once

  /api-keys/{key_id}:
    delete:
      tags:
        - System
      summary: Revoke API key
      description: Admin only
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked

  # ============================================================================
  # STATUS
  # ============================================================================
  /status:
    get:
      tags:
        - System
      summary: API health check
      security: []
      responses:
        '200':
          description: API status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  timestamp:
                    type: string
                  auth:
                    type: object
                  rate_limit:
                    type: object

  # ============================================================================
  # LEGACY ENDPOINTS (Internal Use)
  # ============================================================================
  /song-search:
    get:
      tags:
        - Songs
      summary: Search songs (legacy)
      deprecated: true
      description: Use /songs instead
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: _wpnonce
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response

  /PDF_license_generator/:
    post:
      tags:
        - Licensing
      summary: Generate CC-BY license PDF (legacy)
      deprecated: true
      description: Use /licenses/request instead
      parameters:
        - name: _wpnonce
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - songID
                - licensor
                - projectname
              properties:
                songID:
                  type: integer
                licensor:
                  type: string
                projectname:
                  type: string
      responses:
        '200':
          description: License generated

  /playlists/:
    get:
      tags:
        - Playlists
      summary: Get user playlists
      parameters:
        - name: userID
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response

  /playlists/add:
    post:
      tags:
        - Playlists
      summary: Create new playlist
      parameters:
        - name: _wpnonce
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - playlist_name
              properties:
                playlist_name:
                  type: string
                isprivate:
                  type: string
      responses:
        '200':
          description: Playlist created

  # ============================================================================
  # VERIFICATION (public, unauthenticated)
  # ============================================================================
  /licenses/{id}/verify:
    get:
      tags:
        - Verification
      summary: Verify an issued sync license
      description: |
        Public verification of a license issued by Sync.Land. Takes no
        credentials of any kind, so an external application, a licensee or a
        reviewer can confirm a license independently.

        Where the license has been minted on Cardano, the response carries the
        policy id, asset name, transaction hash and a link to a public block
        explorer, so the assertion can be checked against a source that is not
        Sync.Land.

        An unknown id returns a structured 404 body rather than an error page.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: License post ID
          schema:
            type: integer
          example: 11798
      responses:
        '200':
          description: License found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LicenseVerification'
        '404':
          description: No license with that ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: License not found

  # ============================================================================
  # STREAMER (Personal Access Token)
  # ============================================================================
  /streamer/me:
    get:
      tags:
        - Streamer
      summary: Identify the token holder
      description: |
        Returns the account the presented token belongs to, and the artist
        profiles it owns. Used by external players to confirm which catalogue
        they are entitled to and to display the connected identity.
      security:
        - StreamerToken: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  display_name:
                    type: string
                  artist_ids:
                    type: array
                    items:
                      type: integer
              example:
                user_id: 27
                display_name: CullahMusic
                artist_ids: [10276]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /streamer/playlists:
    get:
      tags:
        - Streamer
      summary: List the token holder's playlists and their tracks
      description: |
        Returns every playlist owned by the token holder. The tracks object is
        keyed by playlist ID, so a client can render a library in one round
        trip.

        Track entries carry display metadata only. No stream URL is issued
        here: a player must call the clearance endpoint per track before
        playback.
      security:
        - StreamerToken: []
      responses:
        '200':
          description: Playlists returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  playlists:
                    type: array
                    items:
                      $ref: '#/components/schemas/StreamerPlaylist'
                  tracks:
                    type: object
                    description: Track lists keyed by playlist ID
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/StreamerTrack'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /streamer/track/{id}/clearance:
    get:
      tags:
        - Streamer
      summary: Check whether a track may be streamed, and on what terms
      description: |
        The authorization check an external player performs before playback.
        Returns the licensing tier, whether attribution is required and the
        exact attribution string to display, plus the stream URL when cleared.

        A false can_stream is a normal, successful response, not an error. A
        client must honour it and skip the track. The reason_if_blocked field
        distinguishes the cases: artist_paused (the artist paused licensing),
        artist_removed (no longer published) and no_license.

        The ai_disclosure field reports what the artist declared at upload
        about AI involvement. A value of undeclared means the track predates
        the question rather than that a claim was checked and rejected.
      security:
        - StreamerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song post ID
          schema:
            type: integer
          example: 11907
      responses:
        '200':
          description: Clearance verdict, cleared or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /streamer/track/{id}/played:
    post:
      tags:
        - Streamer
      summary: Report that a track was played
      description: |
        Writes the play into the usage ledger together with the clearance
        verdict that applied at the time, which is what makes a play auditable
        after the fact rather than merely counted.

        Call it when playback starts. Reporting is required by the Free Sync
        License terms for players that stream on a public channel.
      security:
        - StreamerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song post ID
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  description: Seconds of the track actually played
                playlist_id:
                  type: integer
                  description: Playlist the track was played from, if any
                channel:
                  type: string
                  description: Public channel identifier, where the player knows it
                surface:
                  type: string
                  default: obs-dock
                  description: Which client reported the play
            example:
              seconds: 191
              playlist_id: 12208
              surface: obs-dock
      responses:
        '200':
          description: Play recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # TOKEN MANAGEMENT (same-origin, nonce authenticated)
  # ============================================================================
  /streamer/tokens:
    get:
      tags:
        - Streamer
      summary: List the current user's tokens
      description: |
        Same-origin and nonce-authenticated, not token-authenticated: a
        Personal Access Token cannot enumerate, mint or revoke tokens. Only the
        prefix is ever returned, never the secret.
      security:
        - WordPressNonce: []
      responses:
        '200':
          description: Tokens listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/StreamerToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Streamer
      summary: Mint a new Personal Access Token
      description: |
        Returns the token plaintext exactly once. It is stored only as a
        SHA-256 digest, so a lost token cannot be recovered and must be revoked
        and replaced.
      security:
        - WordPressNonce: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                  default: OBS Player token
                  description: Label shown in the token list
            example:
              name: obs-demo-2026-08-31
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  name:
                    type: string
                  token:
                    type: string
                    description: Plaintext secret. Shown once and never again.
                  prefix:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /streamer/tokens/{id}:
    delete:
      tags:
        - Streamer
      summary: Revoke a token
      description: |
        Marks the token revoked. The audit row is retained rather than deleted,
        so past usage stays attributable.
      security:
        - WordPressNonce: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for external applications
    WordPressNonce:
      type: apiKey
      in: query
      name: _wpnonce
      description: WordPress nonce for same-origin requests
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token (requires JWT plugin)
    StreamerToken:
      type: http
      scheme: bearer
      bearerFormat: sk_syncland_*
      description: |
        Personal Access Token for the streamer API. Minted by the user at
        `/account/tokens/`, prefixed `sk_syncland_`, 53 characters total.
        Stored server-side as a SHA-256 digest only.

  schemas:
    LicenseVerification:
      type: object
      description: Public verification record for an issued license.
      properties:
        license_id:
          type: integer
        license_type:
          type: string
          description: |
            Stored slug. Free-tier licenses issued before the SLFS-v1 migration
            retain the historical cc_by slug; read license_type_label for the
            current name of the tier.
          example: non_exclusive
        license_type_label:
          type: string
          example: Commercial License
        nft_verified:
          type: boolean
        nft_status:
          type: string
          example: minted
        verification_badge:
          type: string
          example: NFT Verified
        blockchain:
          type: object
          description: |
            Present only where the license has been minted. Minting is optional
            and is not performed for every license, so absence of this object
            means the license was not minted, never that verification failed.
          properties:
            network:
              type: string
              description: Human-readable network name, qualified when not mainnet.
              example: Cardano preprod
            network_id:
              type: string
              description: Machine-readable network identifier.
              enum:
                - mainnet
                - preprod
              example: preprod
            transaction_hash:
              type: string
            policy_id:
              type: string
            asset_name:
              type: string
              description: |
                The asset name as it exists on chain, which is the NMKR project
                prefix plus the token name we submitted. Use this with policy_id
                to look the asset up in an explorer; the submitted name alone
                resolves to nothing.
              example: synclandpreprodSL11798_th3l07
            asset_name_submitted:
              type: string
              description: The token name Sync.Land sent to the minting service.
              example: SL11798_th3l07
            explorer_url:
              type: string
              format: uri
              description: Public block explorer link, independent of Sync.Land
        song:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
        artist:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        licensee:
          type: string
        issue_date:
          type: string
        license_url:
          type: string
          format: uri
          description: The issued license PDF

    Clearance:
      type: object
      description: |
        Streaming authorization verdict for one song. A false can_stream is a
        successful response that the client must honour, not an error.
      properties:
        ok:
          type: boolean
        can_stream:
          type: boolean
        tier:
          type: string
          example: SLFS-v1
        tier_label:
          type: string
          example: Free Sync License
        attribution_required:
          type: boolean
        attribution_text:
          type: string
          description: The exact string the player must display on air
        stream_url:
          type: string
          format: uri
          description: Empty when the track is not cleared
        reason_if_blocked:
          type: string
          nullable: true
          enum:
            - artist_paused
            - artist_removed
            - no_license
        ai_disclosure:
          type: string
          description: What the artist declared at upload about AI involvement
          enum:
            - none
            - assisted
            - generated
            - undeclared
        ai_disclosure_label:
          type: string
          example: Not declared
        song:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            title:
              type: string
            artist:
              type: string
            album:
              type: string
            slug:
              type: string
            duration:
              type: integer
              description: Seconds
            cover_url:
              type: string

    StreamerPlaylist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        track_count:
          type: integer
        cover_url:
          type: string
          description: Cover of the first track that has one

    StreamerTrack:
      type: object
      description: Display metadata only. Call the clearance endpoint before playback.
      properties:
        song_id:
          type: integer
        title:
          type: string
        artist:
          type: string
        duration:
          type: integer
          description: Seconds
        cover_url:
          type: string

    StreamerToken:
      type: object
      description: Token record. The secret itself is never returned after creation.
      properties:
        id:
          type: integer
        token_prefix:
          type: string
          example: sk_syncland_ab12
        name:
          type: string
        created_at:
          type: string
        last_used_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
        revoked_at:
          type: string
          nullable: true

    Song:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        album:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        audio_url:
          type: string
        duration:
          type: string
        bpm:
          type: integer
        key:
          type: string
        genre:
          type: string
        mood:
          type: string
        permalink:
          type: string
        created_at:
          type: string
          format: date-time

    Artist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: string
        website:
          type: string
        permalink:
          type: string
        created_at:
          type: string
          format: date-time

    Album:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        release_date:
          type: string
        cover_art:
          type: string
        permalink:
          type: string
        created_at:
          type: string
          format: date-time

    License:
      type: object
      properties:
        id:
          type: integer
        song:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
        license_type:
          type: string
          enum: [cc_by, non_exclusive]
        licensee:
          type: string
        project:
          type: string
        license_url:
          type: string
        nft:
          type: object
          properties:
            status:
              type: string
            asset_id:
              type: string
            transaction_hash:
              type: string
        payment:
          type: object
          properties:
            status:
              type: string
            amount:
              type: integer
            currency:
              type: string
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: Missing, malformed, revoked or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: unauthorized
              message: Invalid or missing token.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: not_found
              message: Resource not found

    Forbidden:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: forbidden
              message: Not authorized to access this resource

    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded. Please try again later.
